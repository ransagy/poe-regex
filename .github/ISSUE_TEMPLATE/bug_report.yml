name: Bug report
description: Something in the engine, CLI, web workbench, or data pipeline is wrong or crashes.
title: "[bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. Please do not paste account details, session IDs, or other personal data — item texts and queries are fine.
  - type: dropdown
    id: component
    attributes:
      label: Component
      options:
        - Engine (PoeRegex.Core)
        - CLI
        - Web workbench (Renly's Recipes)
        - Data pipeline / catalogs
        - Documentation
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: The actual behaviour, including any error text.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Include the item text, query, or command that triggers it (redact character names if you prefer).
      placeholder: |
        1. ...
        2. ...
    validations:
      required: true
  - type: input
    id: build
    attributes:
      label: Build / version
      description: "Web: the build stamp in Advanced. CLI: release tag or --version. Catalog: dataVersion in the JSON."
  - type: input
    id: environment
    attributes:
      label: Environment
      description: "OS, browser, .NET version — whichever apply."
