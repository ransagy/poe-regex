name: data-audit

# Observational inventory check for the public RePoE exports. A new file is a
# blind spot until it is classified in data/repoe.manifest.json.
on:
  workflow_dispatch:
  schedule:
    - cron: '17 6 * * 1'

permissions:
  contents: read

jobs:
  data-audit:
    name: data audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'

      - name: Audit RePoE inventory
        run: >
          dotnet run --project tools/PoeRegex.Data.Build --configuration Release --
          data-audit --check --out data-audit.md

      - name: Upload audit
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: data-audit-${{ github.sha }}
          path: data-audit.md
          if-no-files-found: warn
          retention-days: 30
