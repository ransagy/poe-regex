name: ci

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'

      - name: Test
        run: dotnet test --configuration Release

      - name: Verify catalog provenance
        run: >
          dotnet run --project tools/PoeRegex.Data.Build --configuration Release --
          matrix-status --check --check-shortest

      - name: Verify exact PoE2 proof
        run: >
          dotnet run --project tools/PoeRegex.Data.Build --configuration Release --
          matrix-proof --jobs 2 --check --out /tmp/poe2-proof.json
