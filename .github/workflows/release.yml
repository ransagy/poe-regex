name: release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      rid:
        description: 'RID to build (leave empty for all four)'
        required: false
        type: string

permissions:
  contents: write

jobs:
  build:
    name: build (${{ matrix.rid }})
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(inputs.rid == 'win-x64' && '[{"rid":"win-x64","os":"windows-latest","bin":"poe-regex-win-x64.exe"}]' || inputs.rid == 'linux-x64' && '[{"rid":"linux-x64","os":"ubuntu-latest","bin":"poe-regex-linux-x64"}]' || inputs.rid == 'osx-arm64' && '[{"rid":"osx-arm64","os":"macos-latest","bin":"poe-regex-osx-arm64"}]' || inputs.rid == 'osx-x64' && '[{"rid":"osx-x64","os":"macos-26-intel","bin":"poe-regex-osx-x64"}]' || '[{"rid":"win-x64","os":"windows-latest","bin":"poe-regex-win-x64.exe"},{"rid":"linux-x64","os":"ubuntu-latest","bin":"poe-regex-linux-x64"},{"rid":"osx-arm64","os":"macos-latest","bin":"poe-regex-osx-arm64"},{"rid":"osx-x64","os":"macos-26-intel","bin":"poe-regex-osx-x64"}]') }}
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Setup .NET
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5.4.0
        with:
          dotnet-version: '10.0.x'

      - name: Install Linux AOT prerequisites
        if: matrix.rid == 'linux-x64'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang zlib1g-dev

      - name: Test
        run: dotnet test --configuration Release

      - name: Publish Native AOT
        run: |
          dotnet publish src/PoeRegex.Cli \
            --configuration Release \
            --runtime ${{ matrix.rid }} \
            -p:PublishAot=true \
            -p:StripSymbols=true \
            --output dist

      - name: Rename binaries
        shell: bash
        run: |
          set -euo pipefail
          cd dist
          for f in PoeRegex.Cli*; do
            case "$f" in
              "PoeRegex.Cli.exe") mv "$f" "${{ matrix.bin }}" ;;
              "PoeRegex.Cli.pdb") mv "$f" "${{ matrix.bin }}.pdb" ;;
              "PoeRegex.Cli.dbg") mv "$f" "${{ matrix.bin }}.dbg" ;;
              "PoeRegex.Cli")     mv "$f" "${{ matrix.bin }}" ;;
              *)                  rm -f "$f" ;;
            esac
          done
          ls -la

      - name: Smoke test native binary
        shell: bash
        run: |
          set -euo pipefail
          ./dist/${{ matrix.bin }} list-classes --game poe1 | head -5 >/dev/null
          ./dist/${{ matrix.bin }} generate --game poe1 --include "additional cold damage" --json | grep -q '"query"'
          ./dist/${{ matrix.bin }} generate --game poe2 --keyword "ilvl:80" --include "fire damage" --json >/dev/null
          ./dist/${{ matrix.bin }} list-mods --game poe2 --class "Body Armour" --limit 5 >/dev/null
          ./dist/${{ matrix.bin }} validate --game poe1 --query '"life"' | grep -q '^ok:'
          ./dist/${{ matrix.bin }} explain --game poe1 --class Ring --query '"life" "I"' | grep -q 'included'

          # Subprocess JSON contract: every --json command must emit a single
          # parseable JSON document on stdout and nothing on stderr.
          if command -v python3 >/dev/null 2>&1; then
            ./dist/${{ matrix.bin }} list-classes --game poe1 --json 2>/dev/null | python3 -c 'import json,sys; json.load(sys.stdin)'
            ./dist/${{ matrix.bin }} list-mods --game poe2 --limit 5 --json 2>/dev/null | python3 -c 'import json,sys; json.load(sys.stdin)'
            ./dist/${{ matrix.bin }} validate --game poe1 --query "?=.*life" --json 2>/dev/null | python3 -c 'import json,sys; d=json.load(sys.stdin); assert d["ok"] is True'
            ./dist/${{ matrix.bin }} explain --game poe1 --class Ring --query '"life" "I"' --json 2>/dev/null | python3 -c 'import json,sys; d=json.load(sys.stdin); assert "tokens" in d and "mods" in d and len(d["mods"]) > 0'
          else
            for cmd in "list-classes --game poe1 --json" "list-mods --game poe2 --limit 5 --json" "validate --game poe1 --query life --json" "explain --game poe1 --class Ring --query life --json"; do
              ./dist/${{ matrix.bin }} $cmd >/dev/null 2>&1
            done
          fi
          echo "smoke test passed"

      - name: Include license notices
        shell: bash
        run: cp LICENSE NOTICE dist/

      - name: Upload artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: poe-regex-${{ matrix.rid }}
          path: dist
          if-no-files-found: error

  release:
    name: Create GitHub Release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: artifacts

      - name: Publish release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: artifacts/**/*
          generate_release_notes: true
