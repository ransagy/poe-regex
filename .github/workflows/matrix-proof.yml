name: matrix-proof

# Manual exact proof runner. It checks every chosen matrix scope against the
# exact G1 solver and fails if a shorter legal candidate exists.
on:
  workflow_dispatch:
    inputs:
      family:
        description: 'Comma-separated family keys (empty = all families)'
        required: false
        type: string
        default: ''
      jobs:
        description: 'Internal worker count'
        required: true
        type: string
        default: '2'

permissions:
  contents: read

jobs:
  proof:
    name: matrix proof
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'

      - name: Proof
        shell: bash
        env:
          FAMILY: ${{ inputs.family }}
          JOBS: ${{ inputs.jobs }}
        run: |
          set -euo pipefail
          args=(matrix-proof --matrix docs/CANDIDATE-MATRIX-poe2.html
                --jobs "$JOBS" --check --out matrix-proof.json)
          if [ -n "$FAMILY" ]; then
            args+=(--family "$FAMILY")
          fi
          dotnet run --project tools/PoeRegex.Data.Build --configuration Release -- "${args[@]}"

      - name: Upload proof
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: matrix-proof
          path: matrix-proof.json
          if-no-files-found: warn
