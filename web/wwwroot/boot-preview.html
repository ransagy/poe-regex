<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Boot Animation Preview v9</title>
    <style>
        :root {
            --bg: #14100c;
            --panel: #1e1812;
            --panel-edge: #6b5a34;
            --ink: #d8cdb4;
            --dim: #8a7c5f;
            --accent: #c9a227;
        }
        html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); font-family: Georgia, serif; }
        .wrap { max-width: 760px; margin: 0 auto; padding: 2rem; }
        h1 { color: var(--accent); font-size: 1.5rem; letter-spacing: .06em; margin: 0 0 .25rem; }
        .sub { color: var(--dim); font-size: .85rem; margin-bottom: 1.5rem; }

        /* Anvil dips on impact */
        .boot-anvil-group { animation: anvil-hit 1.6s ease-out infinite; }
        @keyframes anvil-hit {
            0%, 18% { transform: translateY(0); }
            22% { transform: translateY(3px); }
            38%, 100% { transform: translateY(0); }
        }

        /* Hammer swings around grip pivot (130,34). Head at upper-right when raised. */
        .boot-hammer {
            transform-origin: 130px 34px;
            animation: hammer-swing 1.6s cubic-bezier(.6, 0, .7, .4) infinite;
        }
        @keyframes hammer-swing {
            0%, 10% { transform: rotate(-80deg); }
            20% { transform: rotate(0deg); }
            23% { transform: rotate(4deg); }
            32% { transform: rotate(0deg); }
            60%, 100% { transform: rotate(-80deg); }
        }

        /* Sparks: flash, then fly outward and fade — no contracting back */
        .spark {
            transform-box: fill-box;
            transform-origin: center;
            animation: spark-fly 1.6s ease-out infinite;
        }
        @keyframes spark-fly {
            0%, 17% { opacity: 0; transform: scale(.3) translate(0, 0); }
            21% { opacity: 1; transform: scale(1.6) translate(0, 0); }
            30% { opacity: 1; transform: scale(1) translate(0, 0); }
            88%, 100% { opacity: 0; transform: scale(1) translate(var(--dx, 0px), var(--dy, -30px)); }
        }
        .spark:nth-child(odd) { animation-delay: .04s; }
        .spark:nth-child(3n) { animation-delay: .08s; }
        .spark:nth-child(4n) { animation-delay: .12s; }
    </style>
</head>
<body>
    <div class="wrap">
        <h1>Boot Animation Preview v9</h1>
        <p class="sub">Simple blocky hammer (handle through head center), strikes the anvil face, sparks fade outward.</p>

        <svg viewBox="0 0 260 200" width="560" height="430" style="background: var(--panel); border: 1px solid var(--panel-edge); display: block;">
            <!-- Anvil -->
            <g class="boot-anvil-group">
                <ellipse cx="130" cy="178" rx="72" ry="6" fill="#000" opacity=".35"/>
                <!-- Body: face, shoulders, waist, base -->
                <path fill="#6b5a34" d="M92,104 L170,104 L170,116 L158,126 L150,136 L154,146 L162,156 L148,164 L116,164 L104,156 L110,146 L114,136 L106,126 L92,116 Z"/>
                <!-- Horn: rounded cone pointing left at face level -->
                <path fill="#7a6a48" d="M92,106 Q64,98 50,106 Q44,112 48,118 Q60,124 86,122 L92,116 Z"/>
                <!-- Polished face -->
                <rect x="92" y="104" width="78" height="4" fill="#c0b090" opacity=".55"/>
                <!-- Feet -->
                <rect x="104" y="164" width="20" height="10" fill="#4a3e26"/>
                <rect x="138" y="164" width="20" height="10" fill="#4a3e26"/>
            </g>

            <!-- Hammer: grip at pivot (130,34). Handle up-right to a simple blocky head. -->
            <g class="boot-hammer">
                <!-- Grip (top of handle, at pivot) -->
                <rect x="124" y="34" width="12" height="22" rx="2" fill="#4a3e26"/>
                <!-- Handle: from grip down to the head -->
                <rect x="126" y="56" width="10" height="44" rx="2" fill="#6b5a34"/>
                <rect x="126" y="56" width="3" height="44" rx="1" fill="#8a7c5f"/>
                <!-- Head: simple blocky rectangle, wider than tall, handle through its center -->
                <rect x="99" y="98" width="72" height="22" rx="3" fill="#8a7c5f"/>
                <rect x="99" y="98" width="72" height="5" rx="1.5" fill="#b5a888"/>
                <rect x="99" y="114" width="72" height="6" fill="#5a4e38"/>
            </g>

            <!-- Sparks bursting from the strike point (130,100) -->
            <g>
                <circle class="spark" style="--dx:-56px;--dy:-30px" cx="130" cy="100" r="4" fill="#fff3c4"/>
                <circle class="spark" style="--dx:-36px;--dy:-48px" cx="130" cy="98" r="5" fill="#ffd75e"/>
                <circle class="spark" style="--dx:-12px;--dy:-56px" cx="130" cy="96" r="4" fill="#ffd75e"/>
                <circle class="spark" style="--dx:14px;--dy:-56px" cx="130" cy="96" r="4.5" fill="#ffb84d"/>
                <circle class="spark" style="--dx:38px;--dy:-48px" cx="130" cy="98" r="4" fill="#ffb84d"/>
                <circle class="spark" style="--dx:58px;--dy:-26px" cx="130" cy="100" r="4" fill="#fff3c4"/>
                <circle class="spark" style="--dx:-64px;--dy:0px" cx="128" cy="104" r="3.5" fill="#ffd75e"/>
                <circle class="spark" style="--dx:64px;--dy:0px" cx="132" cy="104" r="3.5" fill="#ffd75e"/>
                <circle class="spark" style="--dx:-28px;--dy:32px" cx="128" cy="108" r="3" fill="#ff9b3d"/>
                <circle class="spark" style="--dx:28px;--dy:32px" cx="132" cy="108" r="3" fill="#ff9b3d"/>
                <circle class="spark" style="--dx:0px;--dy:44px" cx="130" cy="112" r="2.5" fill="#ffb84d"/>
                <circle class="spark" style="--dx:-44px;--dy:-16px" cx="128" cy="100" r="3.5" fill="#fff3c4"/>
                <circle class="spark" style="--dx:44px;--dy:-16px" cx="132" cy="100" r="3.5" fill="#fff3c4"/>
                <circle class="spark" style="--dx:-20px;--dy:-36px" cx="128" cy="98" r="3" fill="#ffd75e"/>
                <circle class="spark" style="--dx:20px;--dy:-36px" cx="132" cy="98" r="3" fill="#ffd75e"/>
                <circle class="spark" style="--dx:0px;--dy:-36px" cx="130" cy="94" r="3" fill="#fff3c4"/>
                <circle class="spark" style="--dx:-48px;--dy:16px" cx="126" cy="108" r="3" fill="#ffb84d"/>
                <circle class="spark" style="--dx:48px;--dy:16px" cx="134" cy="108" r="3" fill="#ffb84d"/>
                <circle class="spark" style="--dx:-32px;--dy:-36px" cx="128" cy="96" r="3" fill="#ffd75e"/>
                <circle class="spark" style="--dx:32px;--dy:-36px" cx="132" cy="96" r="3" fill="#ffd75e"/>
                <circle class="spark" style="--dx:-60px;--dy:-8px" cx="126" cy="102" r="2.5" fill="#ffb84d"/>
                <circle class="spark" style="--dx:60px;--dy:-8px" cx="134" cy="102" r="2.5" fill="#ffb84d"/>
                <circle class="spark" style="--dx:-8px;--dy:-44px" cx="130" cy="94" r="2.5" fill="#fff3c4"/>
                <circle class="spark" style="--dx:8px;--dy:-44px" cx="130" cy="94" r="2.5" fill="#fff3c4"/>
                <circle class="spark" style="--dx:0px;--dy:32px" cx="130" cy="112" r="2.2" fill="#ffb84d"/>
            </g>
        </svg>
    </div>
</body>
</html>
