<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Boot Animation Preview v2</title>
    <style>
        :root {
            --bg: #14100c;
            --panel: #1e1812;
            --panel-edge: #6b5a34;
            --ink: #d8cdb4;
            --dim: #8a7c5f;
            --accent: #c9a227;
        }
        html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); font-family: Georgia, serif; }
        .wrap { max-width: 1000px; margin: 0 auto; padding: 2rem; }
        h1 { color: var(--accent); font-size: 1.5rem; letter-spacing: .06em; margin: 0 0 .25rem; }
        .sub { color: var(--dim); font-size: .85rem; margin-bottom: 2rem; }
        .grid { display: flex; gap: 2rem; flex-wrap: wrap; }
        .card { background: var(--panel); border: 1px solid var(--panel-edge); padding: 1rem; width: 240px; text-align: center; }
        .card h3 { margin: 0 0 .5rem; font-size: .95rem; }
        .card .desc { color: var(--dim); font-size: .75rem; margin-top: .5rem; }

        /* === Shared geometry === */
        .boot-anvil { fill: #6b5a34; }
        .boot-anvil-face { fill: #a89878; opacity: .45; }
        .boot-anvil-shadow { fill: #000; opacity: .35; }

        /* Hammer: claw head + handle, pivot at grip top (126,26). */
        .boot-hammer {
            transform-origin: 126px 26px;
            animation: hammer-strike 1.8s cubic-bezier(.65, 0, .75, .35) infinite;
        }
        @keyframes hammer-strike {
            0%, 14% { transform: rotate(42deg); }
            27% { transform: rotate(0deg); }
            30%, 40% { transform: rotate(-2deg); }
            62%, 100% { transform: rotate(42deg); }
        }
        .hammer-handle { fill: #6b5a34; }
        .hammer-handle-hi { fill: #8a7c5f; }
        .hammer-head { fill: #8a7c5f; }
        .hammer-head-hi { fill: #b5a888; }

        /* === F: big impact flash + 3 sparks === */
        .boot-impact { animation: impact-flash 1.8s ease-out infinite; }
        @keyframes impact-flash {
            0%, 26% { opacity: 0; transform: scale(.3); }
            30% { opacity: 1; transform: scale(1.9); }
            46%, 100% { opacity: 0; transform: scale(1); }
        }
        .sp1 { animation: sparks-f 1.8s ease-out infinite; }
        @keyframes sparks-f {
            0%, 26% { opacity: 0; transform: scale(.3); }
            31% { opacity: 1; transform: scale(1.7); }
            52%, 100% { opacity: 0; transform: scale(.35) translate(0, -12px); }
        }
        .sp2 { animation: sparks-f2 1.8s ease-out infinite; }
        @keyframes sparks-f2 {
            0%, 27% { opacity: 0; transform: scale(.3); }
            32% { opacity: 1; transform: scale(1.4); }
            54%, 100% { opacity: 0; transform: scale(.35) translate(-10px, -8px); }
        }
        .sp3 { animation: sparks-f3 1.8s ease-out infinite; }
        @keyframes sparks-f3 {
            0%, 28% { opacity: 0; transform: scale(.3); }
            33% { opacity: 1; transform: scale(1.4); }
            56%, 100% { opacity: 0; transform: scale(.35) translate(10px, -8px); }
        }

        /* === G: 5-spark burst === */
        .gp1 { animation: sparks-g 1.8s ease-out infinite; }
        @keyframes sparks-g {
            0%, 26% { opacity: 0; transform: scale(.3); }
            31% { opacity: 1; transform: scale(1.6); }
            50%, 100% { opacity: 0; transform: scale(.35) translate(0, -14px); }
        }
        .gp2 { animation: sparks-g2 1.8s ease-out infinite; }
        @keyframes sparks-g2 {
            0%, 27% { opacity: 0; transform: scale(.3); }
            32% { opacity: 1; transform: scale(1.3); }
            52%, 100% { opacity: 0; transform: scale(.35) translate(-14px, -6px); }
        }
        .gp3 { animation: sparks-g3 1.8s ease-out infinite; }
        @keyframes sparks-g3 {
            0%, 28% { opacity: 0; transform: scale(.3); }
            33% { opacity: 1; transform: scale(1.3); }
            54%, 100% { opacity: 0; transform: scale(.35) translate(14px, -6px); }
        }
        .gp4 { animation: sparks-g4 1.8s ease-out infinite; }
        @keyframes sparks-g4 {
            0%, 29% { opacity: 0; transform: scale(.3); }
            34% { opacity: 1; transform: scale(1.2); }
            56%, 100% { opacity: 0; transform: scale(.35) translate(-8px, -16px); }
        }
        .gp5 { animation: sparks-g5 1.8s ease-out infinite; }
        @keyframes sparks-g5 {
            0%, 30% { opacity: 0; transform: scale(.3); }
            35% { opacity: 1; transform: scale(1.2); }
            58%, 100% { opacity: 0; transform: scale(.35) translate(8px, -16px); }
        }

        /* === H: expanding ring + spark === */
        .boot-ring { animation: ring-wave 1.8s ease-out infinite; }
        @keyframes ring-wave {
            0%, 26% { opacity: 0; transform: scale(.3); }
            31% { opacity: .85; transform: scale(1); }
            58%, 100% { opacity: 0; transform: scale(2.4); }
        }
        .hp1 { animation: sparks-h 1.8s ease-out infinite; }
        @keyframes sparks-h {
            0%, 26% { opacity: 0; transform: scale(.3); }
            32% { opacity: 1; transform: scale(1.8); }
            50%, 100% { opacity: 0; transform: scale(.4) translate(0, -10px); }
        }
    </style>
</head>
<body>
    <div class="wrap">
        <h1>Boot Animation Preview v2</h1>
        <p class="sub">Fixed geometry — claw hammer strikes the anvil face. Pick one.</p>
        <div class="grid">

            <div class="card">
                <h3>F — Big impact + sparks</h3>
                <svg viewBox="0 0 240 180" width="200" height="150">
                    <ellipse class="boot-anvil-shadow" cx="126" cy="152" rx="62" ry="5"/>
                    <path class="boot-anvil" d="M66,98 Q76,106 86,112 L88,116 L172,116 L164,126 L156,130 L152,140 L144,148 L116,148 L108,140 L104,130 L96,126 L88,116 Z"/>
                    <rect class="boot-anvil-face" x="88" y="112" width="84" height="4"/>
                    <g class="boot-hammer">
                        <rect class="hammer-handle" x="121" y="26" width="10" height="70" rx="2"/>
                        <rect class="hammer-handle-hi" x="121" y="26" width="3" height="70" rx="1"/>
                        <path class="hammer-head" d="M96,96 L148,96 L148,116 L144,116 L136,106 L128,116 L96,116 Z"/>
                        <path class="hammer-head-hi" d="M96,96 L148,96 L148,100 L96,100 Z"/>
                    </g>
                    <ellipse class="boot-impact" cx="116" cy="112" rx="12" ry="4" fill="#fff3c4" opacity="0"/>
                    <g fill="#ffd75e">
                        <circle class="sp1" cx="116" cy="108" r="3.5"/>
                        <circle class="sp2" cx="104" cy="104" r="2.5" fill="#ffb84d"/>
                        <circle class="sp3" cx="128" cy="104" r="2.5" fill="#ffb84d"/>
                    </g>
                </svg>
                <div class="desc">Head strikes anvil, big flash + 3 sparks</div>
            </div>

            <div class="card">
                <h3>G — 5-spark burst</h3>
                <svg viewBox="0 0 240 180" width="200" height="150">
                    <ellipse class="boot-anvil-shadow" cx="126" cy="152" rx="62" ry="5"/>
                    <path class="boot-anvil" d="M66,98 Q76,106 86,112 L88,116 L172,116 L164,126 L156,130 L152,140 L144,148 L116,148 L108,140 L104,130 L96,126 L88,116 Z"/>
                    <rect class="boot-anvil-face" x="88" y="112" width="84" height="4"/>
                    <g class="boot-hammer">
                        <rect class="hammer-handle" x="121" y="26" width="10" height="70" rx="2"/>
                        <rect class="hammer-handle-hi" x="121" y="26" width="3" height="70" rx="1"/>
                        <path class="hammer-head" d="M96,96 L148,96 L148,116 L144,116 L136,106 L128,116 L96,116 Z"/>
                        <path class="hammer-head-hi" d="M96,96 L148,96 L148,100 L96,100 Z"/>
                    </g>
                    <g>
                        <circle class="gp1" cx="116" cy="106" r="4" fill="#ffd75e"/>
                        <circle class="gp2" cx="102" cy="100" r="2.5" fill="#ffb84d"/>
                        <circle class="gp3" cx="130" cy="100" r="2.5" fill="#ffb84d"/>
                        <circle class="gp4" cx="106" cy="116" r="2" fill="#ff9b3d"/>
                        <circle class="gp5" cx="126" cy="116" r="2" fill="#ff9b3d"/>
                    </g>
                </svg>
                <div class="desc">Sparks burst outward on impact</div>
            </div>

            <div class="card">
                <h3>H — Ring wave</h3>
                <svg viewBox="0 0 240 180" width="200" height="150">
                    <ellipse class="boot-anvil-shadow" cx="126" cy="152" rx="62" ry="5"/>
                    <path class="boot-anvil" d="M66,98 Q76,106 86,112 L88,116 L172,116 L164,126 L156,130 L152,140 L144,148 L116,148 L108,140 L104,130 L96,126 L88,116 Z"/>
                    <rect class="boot-anvil-face" x="88" y="112" width="84" height="4"/>
                    <g class="boot-hammer">
                        <rect class="hammer-handle" x="121" y="26" width="10" height="70" rx="2"/>
                        <rect class="hammer-handle-hi" x="121" y="26" width="3" height="70" rx="1"/>
                        <path class="hammer-head" d="M96,96 L148,96 L148,116 L144,116 L136,106 L128,116 L96,116 Z"/>
                        <path class="hammer-head-hi" d="M96,96 L148,96 L148,100 L96,100 Z"/>
                    </g>
                    <circle class="boot-ring" cx="116" cy="114" r="6" fill="none" stroke="#c9a227" stroke-width="2.5" opacity="0"/>
                    <circle class="hp1" cx="116" cy="108" r="4" fill="#ffd75e"/>
                </svg>
                <div class="desc">Expanding gold ring + spark on impact</div>
            </div>

        </div>
    </div>
</body>
</html>
