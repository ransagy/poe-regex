<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Boot Animation Preview v4</title>
    <style>
        :root {
            --bg: #14100c;
            --panel: #1e1812;
            --panel-edge: #6b5a34;
            --ink: #d8cdb4;
            --dim: #8a7c5f;
            --accent: #c9a227;
        }
        html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); font-family: Georgia, serif; }
        .wrap { max-width: 1000px; margin: 0 auto; padding: 2rem; }
        h1 { color: var(--accent); font-size: 1.5rem; letter-spacing: .06em; margin: 0 0 .25rem; }
        .sub { color: var(--dim); font-size: .85rem; margin-bottom: 2rem; }
        .grid { display: flex; gap: 2rem; flex-wrap: wrap; }
        .card { background: var(--panel); border: 1px solid var(--panel-edge); padding: 1rem; width: 250px; text-align: center; }
        .card h3 { margin: 0 0 .5rem; font-size: .95rem; }
        .card .desc { color: var(--dim); font-size: .75rem; margin-top: .5rem; }

        /* Anvil dips on impact */
        .boot-anvil-group { animation: anvil-hit 1.7s ease-out infinite; }
        @keyframes anvil-hit {
            0%, 24% { transform: translateY(0); }
            28% { transform: translateY(3px); }
            44%, 100% { transform: translateY(0); }
        }

        /* Hammer: grip at bottom-left (pivot), head swings down from upper-right */
        .boot-hammer {
            transform-origin: 36px 24px;
            animation: hammer-swing 1.7s cubic-bezier(.6, 0, .7, .4) infinite;
        }
        @keyframes hammer-swing {
            0%, 14% { transform: rotate(-8deg); }
            26% { transform: rotate(51deg); }
            28% { transform: rotate(47deg); }
            36% { transform: rotate(50deg); }
            62%, 100% { transform: rotate(-8deg); }
        }

        /* Impact flash */
        .boot-impact { animation: impact-flash 1.7s ease-out infinite; }
        @keyframes impact-flash {
            0%, 25% { opacity: 0; transform: scale(.3); }
            28% { opacity: 1; transform: scale(1.5); }
            48%, 100% { opacity: 0; transform: scale(2); }
        }

        /* Ring wave */
        .boot-ring { animation: ring-wave 1.7s ease-out infinite; }
        @keyframes ring-wave {
            0%, 25% { opacity: 0; transform: scale(.3); }
            29% { opacity: .9; transform: scale(1); }
            60%, 100% { opacity: 0; transform: scale(2.6); }
        }

        /* Sparks: small bright dots flying outward */
        .spark { transform-box: fill-box; transform-origin: center; }
        .sp1 { animation: sp1 1.7s ease-out infinite; }
        @keyframes sp1 {
            0%, 27% { opacity: 0; transform: scale(.3) translate(0,0); }
            31% { opacity: 1; transform: scale(1.2) translate(0,0); }
            62%, 100% { opacity: 0; transform: scale(.3) translate(-22px,-12px); }
        }
        .sp2 { animation: sp2 1.7s ease-out infinite; }
        @keyframes sp2 {
            0%, 28% { opacity: 0; transform: scale(.3) translate(0,0); }
            32% { opacity: 1; transform: scale(1.3) translate(0,0); }
            64%, 100% { opacity: 0; transform: scale(.3) translate(-12px,-18px); }
        }
        .sp3 { animation: sp3 1.7s ease-out infinite; }
        @keyframes sp3 {
            0%, 29% { opacity: 0; transform: scale(.3) translate(0,0); }
            33% { opacity: 1; transform: scale(1.1) translate(0,0); }
            66%, 100% { opacity: 0; transform: scale(.3) translate(0,-22px); }
        }
        .sp4 { animation: sp4 1.7s ease-out infinite; }
        @keyframes sp4 {
            0%, 30% { opacity: 0; transform: scale(.3) translate(0,0); }
            34% { opacity: 1; transform: scale(1.2) translate(0,0); }
            68%, 100% { opacity: 0; transform: scale(.3) translate(12px,-18px); }
        }
        .sp5 { animation: sp5 1.7s ease-out infinite; }
        @keyframes sp5 {
            0%, 31% { opacity: 0; transform: scale(.3) translate(0,0); }
            35% { opacity: 1; transform: scale(1) translate(0,0); }
            70%, 100% { opacity: 0; transform: scale(.3) translate(22px,-10px); }
        }
        .sp6 { animation: sp6 1.7s ease-out infinite; }
        @keyframes sp6 {
            0%, 32% { opacity: 0; transform: scale(.3) translate(0,0); }
            36% { opacity: 1; transform: scale(.9) translate(0,0); }
            72%, 100% { opacity: 0; transform: scale(.3) translate(-24px,4px); }
        }
        .sp7 { animation: sp7 1.7s ease-out infinite; }
        @keyframes sp7 {
            0%, 33% { opacity: 0; transform: scale(.3) translate(0,0); }
            37% { opacity: 1; transform: scale(.9) translate(0,0); }
            74%, 100% { opacity: 0; transform: scale(.3) translate(24px,4px); }
        }
        .sp8 { animation: sp8 1.7s ease-out infinite; }
        @keyframes sp8 {
            0%, 34% { opacity: 0; transform: scale(.3) translate(0,0); }
            38% { opacity: 1; transform: scale(.8) translate(0,0); }
            76%, 100% { opacity: 0; transform: scale(.3) translate(-10px,14px); }
        }
        .sp9 { animation: sp9 1.7s ease-out infinite; }
        @keyframes sp9 {
            0%, 35% { opacity: 0; transform: scale(.3) translate(0,0); }
            39% { opacity: 1; transform: scale(.8) translate(0,0); }
            78%, 100% { opacity: 0; transform: scale(.3) translate(10px,14px); }
        }
    </style>
</head>
<body>
    <div class="wrap">
        <h1>Boot Animation Preview v4</h1>
        <p class="sub">Hammer held by grip, head swings down onto the anvil. Small bright sparks.</p>
        <div class="grid">

            <div class="card">
                <h3>L — Clean strike + sparks</h3>
                <svg viewBox="0 0 260 200" width="210" height="162">
                    <g class="boot-anvil-group">
                        <ellipse cx="120" cy="180" rx="72" ry="6" fill="#000" opacity=".35"/>
                        <path fill="#7a6a48" d="M84,100 Q52,84 40,92 Q48,104 72,106 Z"/>
                        <path fill="#6b5a34" d="M84,100 L180,100 L180,114 L168,126 L160,138 L164,148 L148,158 L128,166 L100,166 L88,158 L96,148 L100,138 L92,126 L84,114 Z"/>
                        <rect x="84" y="100" width="96" height="12" fill="#8a7c5f"/>
                        <rect x="84" y="100" width="96" height="4" fill="#c0b090" opacity=".6"/>
                        <rect x="96" y="166" width="18" height="10" fill="#4a3e26"/>
                        <rect x="132" y="166" width="18" height="10" fill="#4a3e26"/>
                    </g>
                    <g class="boot-hammer">
                        <rect x="0" y="-6" width="30" height="12" rx="2" fill="#4a3e26"/>
                        <rect x="30" y="-6" width="100" height="12" rx="2" fill="#6b5a34"/>
                        <rect x="30" y="-6" width="100" height="4" rx="1" fill="#8a7c5f"/>
                        <rect x="100" y="-20" width="50" height="40" rx="3" fill="#8a7c5f"/>
                        <rect x="100" y="-20" width="50" height="5" rx="1.5" fill="#b5a888"/>
                        <rect x="100" y="14" width="50" height="6" fill="#5a4e38"/>
                    </g>
                    <ellipse class="boot-impact" cx="111" cy="104" rx="10" ry="3" fill="#fff3c4" opacity="0"/>
                    <g>
                        <circle class="spark sp1" cx="111" cy="104" r="2.5" fill="#fff3c4"/>
                        <circle class="spark sp2" cx="111" cy="104" r="2.5" fill="#ffd75e"/>
                        <circle class="spark sp3" cx="111" cy="104" r="2" fill="#ffd75e"/>
                        <circle class="spark sp4" cx="111" cy="104" r="2.5" fill="#ffb84d"/>
                        <circle class="spark sp5" cx="111" cy="104" r="2" fill="#ffb84d"/>
                        <circle class="spark sp6" cx="111" cy="104" r="2" fill="#ffd75e"/>
                        <circle class="spark sp7" cx="111" cy="104" r="2" fill="#ffb84d"/>
                        <circle class="spark sp8" cx="111" cy="104" r="1.5" fill="#fff3c4"/>
                        <circle class="spark sp9" cx="111" cy="104" r="1.5" fill="#ffd75e"/>
                    </g>
                </svg>
                <div class="desc">Grip held, head swings down; 9 small sparks + flash</div>
            </div>

            <div class="card">
                <h3>M — Ring + sparks</h3>
                <svg viewBox="0 0 260 200" width="210" height="162">
                    <g class="boot-anvil-group">
                        <ellipse cx="120" cy="180" rx="72" ry="6" fill="#000" opacity=".35"/>
                        <path fill="#7a6a48" d="M84,100 Q52,84 40,92 Q48,104 72,106 Z"/>
                        <path fill="#6b5a34" d="M84,100 L180,100 L180,114 L168,126 L160,138 L164,148 L148,158 L128,166 L100,166 L88,158 L96,148 L100,138 L92,126 L84,114 Z"/>
                        <rect x="84" y="100" width="96" height="12" fill="#8a7c5f"/>
                        <rect x="84" y="100" width="96" height="4" fill="#c0b090" opacity=".6"/>
                        <rect x="96" y="166" width="18" height="10" fill="#4a3e26"/>
                        <rect x="132" y="166" width="18" height="10" fill="#4a3e26"/>
                    </g>
                    <g class="boot-hammer">
                        <rect x="0" y="-6" width="30" height="12" rx="2" fill="#4a3e26"/>
                        <rect x="30" y="-6" width="100" height="12" rx="2" fill="#6b5a34"/>
                        <rect x="30" y="-6" width="100" height="4" rx="1" fill="#8a7c5f"/>
                        <rect x="100" y="-20" width="50" height="40" rx="3" fill="#8a7c5f"/>
                        <rect x="100" y="-20" width="50" height="5" rx="1.5" fill="#b5a888"/>
                        <rect x="100" y="14" width="50" height="6" fill="#5a4e38"/>
                    </g>
                    <circle class="boot-ring" cx="111" cy="108" r="6" fill="none" stroke="#c9a227" stroke-width="2.5" opacity="0"/>
                    <ellipse class="boot-impact" cx="111" cy="104" rx="10" ry="3" fill="#fff3c4" opacity="0"/>
                    <g>
                        <circle class="spark sp1" cx="111" cy="104" r="2.5" fill="#fff3c4"/>
                        <circle class="spark sp2" cx="111" cy="104" r="2.5" fill="#ffd75e"/>
                        <circle class="spark sp3" cx="111" cy="104" r="2" fill="#ffd75e"/>
                        <circle class="spark sp4" cx="111" cy="104" r="2.5" fill="#ffb84d"/>
                        <circle class="spark sp5" cx="111" cy="104" r="2" fill="#ffb84d"/>
                        <circle class="spark sp6" cx="111" cy="104" r="2" fill="#ffd75e"/>
                        <circle class="spark sp7" cx="111" cy="104" r="2" fill="#ffb84d"/>
                        <circle class="spark sp8" cx="111" cy="104" r="1.5" fill="#fff3c4"/>
                        <circle class="spark sp9" cx="111" cy="104" r="1.5" fill="#ffd75e"/>
                    </g>
                </svg>
                <div class="desc">Expanding gold ring + 9 sparks</div>
            </div>

        </div>
    </div>
</body>
</html>
