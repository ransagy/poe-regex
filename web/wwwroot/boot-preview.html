<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Boot Animation Preview v5</title>
    <style>
        :root {
            --bg: #14100c;
            --panel: #1e1812;
            --panel-edge: #6b5a34;
            --ink: #d8cdb4;
            --dim: #8a7c5f;
            --accent: #c9a227;
        }
        html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); font-family: Georgia, serif; }
        .wrap { max-width: 1100px; margin: 0 auto; padding: 2rem; }
        h1 { color: var(--accent); font-size: 1.5rem; letter-spacing: .06em; margin: 0 0 .25rem; }
        .sub { color: var(--dim); font-size: .85rem; margin-bottom: 2rem; }
        .grid { display: flex; gap: 2rem; flex-wrap: wrap; }
        .card { background: var(--panel); border: 1px solid var(--panel-edge); padding: 1rem; width: 250px; text-align: center; }
        .card h3 { margin: 0 0 .5rem; font-size: .95rem; }
        .card .desc { color: var(--dim); font-size: .75rem; margin-top: .5rem; }

        /* Anvil dips on impact */
        .boot-anvil-group { animation: anvil-hit 1.7s ease-out infinite; }
        @keyframes anvil-hit {
            0%, 24% { transform: translateY(0); }
            28% { transform: translateY(3px); }
            44%, 100% { transform: translateY(0); }
        }

        /* Hammer: grip at bottom-left (pivot), head swings down from upper-right */
        .boot-hammer {
            transform-origin: 36px 24px;
            animation: hammer-swing 1.7s cubic-bezier(.6, 0, .7, .4) infinite;
        }
        @keyframes hammer-swing {
            0%, 14% { transform: rotate(-8deg); }
            26% { transform: rotate(51deg); }
            28% { transform: rotate(47deg); }
            36% { transform: rotate(50deg); }
            62%, 100% { transform: rotate(-8deg); }
        }

        /* Impact flash */
        .boot-impact { animation: impact-flash 1.7s ease-out infinite; }
        @keyframes impact-flash {
            0%, 25% { opacity: 0; transform: scale(.3); }
            28% { opacity: 1; transform: scale(1.6); }
            50%, 100% { opacity: 0; transform: scale(2.2); }
        }

        /* Ring wave */
        .boot-ring { animation: ring-wave 1.7s ease-out infinite; }
        @keyframes ring-wave {
            0%, 25% { opacity: 0; transform: scale(.3); }
            29% { opacity: .9; transform: scale(1); }
            62%, 100% { opacity: 0; transform: scale(2.8); }
        }

        /* Sparks: small bright dots bursting outward via CSS custom properties */
        .spark {
            transform-box: fill-box;
            transform-origin: center;
            animation: spark-fly 1.7s ease-out infinite;
        }
        @keyframes spark-fly {
            0%, 26% { opacity: 0; transform: scale(.3) translate(0, 0); }
            30% { opacity: 1; transform: scale(1.3) translate(0, 0); }
            72%, 100% { opacity: 0; transform: scale(.3) translate(var(--dx, 0px), var(--dy, -12px)); }
        }

        /* Stagger the burst so sparks don't all fire at once */
        .spark:nth-child(2) { animation-delay: .02s; }
        .spark:nth-child(3) { animation-delay: .04s; }
        .spark:nth-child(4) { animation-delay: .06s; }
        .spark:nth-child(5) { animation-delay: .03s; }
        .spark:nth-child(6) { animation-delay: .08s; }
        .spark:nth-child(7) { animation-delay: .05s; }
        .spark:nth-child(8) { animation-delay: .1s; }
        .spark:nth-child(9) { animation-delay: .07s; }
        .spark:nth-child(10) { animation-delay: .12s; }
        .spark:nth-child(11) { animation-delay: .09s; }
        .spark:nth-child(12) { animation-delay: .14s; }
    </style>
</head>
<body>
    <div class="wrap">

        <p class="sub">Classic anvil (horn, face, waist, base). Peen-hammer head. Spark burst.</p>
