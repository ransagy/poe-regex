<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Boot Animation Preview v8</title>
    <style>
        :root {
            --bg: #14100c;
            --panel: #1e1812;
            --panel-edge: #6b5a34;
            --ink: #d8cdb4;
            --dim: #8a7c5f;
            --accent: #c9a227;
        }
        html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); font-family: Georgia, serif; }
        .wrap { max-width: 900px; margin: 0 auto; padding: 2rem; }
        h1 { color: var(--accent); font-size: 1.5rem; letter-spacing: .06em; margin: 0 0 .25rem; }
        .sub { color: var(--dim); font-size: .85rem; margin-bottom: 1.5rem; }

        /* Anvil dips on impact */
        .boot-anvil-group { animation: anvil-hit 1.6s ease-out infinite; }
        @keyframes anvil-hit {
            0%, 18% { transform: translateY(0); }
            22% { transform: translateY(3px); }
            38%, 100% { transform: translateY(0); }
        }

        /* Hammer swings around grip pivot */
        .boot-hammer {
            transform-origin: 78px 152px;
            animation: hammer-swing 1.6s cubic-bezier(.6, 0, .7, .4) infinite;
        }
        @keyframes hammer-swing {
            0%, 12% { transform: rotate(38deg); }
            22% { transform: rotate(8deg); }
            25% { transform: rotate(4deg); }
            34% { transform: rotate(7deg); }
            60%, 100% { transform: rotate(38deg); }
        }

        /* Sparks: big, fast, travel far, just fade out */
        .spark {
            transform-box: fill-box;
            transform-origin: center;
            animation: spark-fly 1.6s ease-out infinite;
        }
        @keyframes spark-fly {
            0%, 17% { opacity: 0; transform: scale(.3) translate(0, 0); }
            21% { opacity: 1; transform: scale(1.6) translate(0, 0); }
            85%, 100% { opacity: 0; transform: scale(.4) translate(var(--dx, 0px), var(--dy, -30px)); }
        }
        .spark:nth-child(odd) { animation-delay: .04s; }
        .spark:nth-child(3n) { animation-delay: .08s; }
        .spark:nth-child(4n) { animation-delay: .12s; }
    </style>
</head>
<body>
    <div class="wrap">
        <h1>Boot Animation Preview v8</h1>
        <p class="sub">Simple blocky rectangular hammer head, clear handle, strikes the anvil face. Sparks fade outward.</p>

        <svg viewBox="0 0 260 200" width="560" height="430" style="background: var(--panel); border: 1px solid var(--panel-edge); display: block;">
            <!-- Anvil -->
            <g class="boot-anvil-group">
                <ellipse cx="130" cy="178" rx="72" ry="6" fill="#000" opacity=".35"/>
                <!-- Body: face, waist, base -->
                <path fill="#6b5a34" d="M92,108 L170,108 L170,122 L158,134 L162,144 L146,154 L118,154 L106,144 L110,134 L92,122 Z"/>
                <!-- Horn: rounded cone pointing left at face level -->
                <path fill="#7a6a48" d="M92,110 Q64,104 52,112 Q46,118 50,124 Q62,130 86,128 L92,122 Z"/>
                <!-- Polished face -->
                <rect x="92" y="108" width="78" height="4" fill="#c0b090" opacity=".55"/>
                <!-- Feet -->
                <rect x="102" y="154" width="20" height="10" fill="#4a3e26"/>
                <rect x="140" y="154" width="20" height="10" fill="#4a3e26"/>
            </g>

            <!-- Hammer: pivot at grip (78,152). Handle up to head.
                 Head = simple blocky rectangle perpendicular to handle. -->
            <g class="boot-hammer">
                <!-- Grip (bottom of handle, where pivot is) -->
                <rect x="72" y="138" width="12" height="22" rx="2" fill="#4a3e26"/>
                <!-- Handle -->
                <rect x="74" y="80" width="10" height="62" rx="2" fill="#6b5a34"/>
                <rect x="74" y="80" width="3" height="62" rx="1" fill="#8a7c5f"/>
                <!-- Head: simple blocky rectangle, wider than tall -->
                <rect x="58" y="58" width="62" height="20" rx="3" fill="#8a7c5f"/>
                <rect x="58" y="58" width="62" height="4" rx="1" fill="#b5a888"/>
                <rect x="58" y="74" width="62" height="4" fill="#5a4e38"/>
            </g>

            <!-- Sparks bursting from impact point (96,76) -->
            <g>
                <circle class="spark" style="--dx:-56px;--dy:-30px" cx="96" cy="76" r="4" fill="#fff3c4"/>
                <circle class="spark" style="--dx:-36px;--dy:-52px" cx="96" cy="74" r="5" fill="#ffd75e"/>
                <circle class="spark" style="--dx:-12px;--dy:-64px" cx="96" cy="72" r="4" fill="#ffd75e"/>
                <circle class="spark" style="--dx:14px;--dy:-60px" cx="96" cy="72" r="4.5" fill="#ffb84d"/>
                <circle class="spark" style="--dx:38px;--dy:-48px" cx="96" cy="74" r="4" fill="#ffb84d"/>
                <circle class="spark" style="--dx:58px;--dy:-26px" cx="96" cy="76" r="4" fill="#fff3c4"/>
                <circle class="spark" style="--dx:-62px;--dy:-4px" cx="94" cy="78" r="3.5" fill="#ffd75e"/>
                <circle class="spark" style="--dx:62px;--dy:-6px" cx="98" cy="78" r="3.5" fill="#ffd75e"/>
                <circle class="spark" style="--dx:-30px;--dy:28px" cx="94" cy="80" r="3" fill="#ff9b3d"/>
                <circle class="spark" style="--dx:30px;--dy:28px" cx="98" cy="80" r="3" fill="#ff9b3d"/>
                <circle class="spark" style="--dx:0px;--dy:40px" cx="96" cy="82" r="2.5" fill="#ffb84d"/>
                <circle class="spark" style="--dx:-46px;--dy:-16px" cx="94" cy="74" r="3.5" fill="#fff3c4"/>
                <circle class="spark" style="--dx:46px;--dy:-14px" cx="98" cy="74" r="3.5" fill="#fff3c4"/>
                <circle class="spark" style="--dx:-20px;--dy:-36px" cx="94" cy="72" r="3" fill="#ffd75e"/>
                <circle class="spark" style="--dx:20px;--dy:-36px" cx="98" cy="72" r="3" fill="#ffd75e"/>
                <circle class="spark" style="--dx:0px;--dy:-48px" cx="96" cy="70" r="3" fill="#fff3c4"/>
                <circle class="spark" style="--dx:-66px;--dy:-14px" cx="92" cy="76" r="2.5" fill="#ffb84d"/>
                <circle class="spark" style="--dx:66px;--dy:-12px" cx="100" cy="76" r="2.5" fill="#ffb84d"/>
                <circle class="spark" style="--dx:-38px;--dy:12px" cx="94" cy="82" r="2.5" fill="#ff9b3d"/>
                <circle class="spark" style="--dx:38px;--dy:12px" cx="98" cy="82" r="2.5" fill="#ff9b3d"/>
                <circle class="spark" style="--dx:-14px;--dy:22px" cx="94" cy="82" r="2" fill="#ffb84d"/>
                <circle class="spark" style="--dx:14px;--dy:22px" cx="98" cy="82" r="2" fill="#ffb84d"/>
                <circle class="spark" style="--dx:0px;--dy:-60px" cx="96" cy="70" r="2" fill="#fff3c4"/>
            </g>
        </svg>
    </div>
</body>
</html>
